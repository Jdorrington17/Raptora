name: Bug report (synthetic reproduction)
description: Report a non-confidential defect with reproducible evidence.
body:
  - type: markdown
    attributes:
      value: "This is public. Never submit credentials, customer details, camera evidence, private source or topology. Report vulnerabilities through SECURITY.md instead."
  - type: checkboxes
    id: public-safety
    attributes:
      label: Public disclosure check
      options:
        - label: This report uses synthetic or safely redacted information and contains no confidential security finding.
          required: true
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      description: Public commit/version, OS and relevant tool versions; no customer identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction and expected versus observed behavior
      description: Minimal steps; do not run connected or privileged tests without separate authorization.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks and impact
      description: Exact commands and Pass/Fail/Skipped/Blocked/Not run; distinguish synthetic, Windows and connected evidence.
    validations:
      required: true
